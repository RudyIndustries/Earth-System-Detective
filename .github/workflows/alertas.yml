# Vigilancia semanal de incendios (NASA FIRMS) en las cuencas en riesgo.
# Corre cada lunes a las 12:00 UTC (08:00 en Bolivia) y tambien se puede lanzar a mano desde la pestana Actions.
#
# Secretos que hay que crear en GitHub (Settings > Secrets and variables > Actions):
#   GEE_SERVICE_ACCOUNT_KEY  JSON de una cuenta de servicio registrada en Earth Engine para el proyecto
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID                     (opcional)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, ALERT_EMAIL_TO   (opcional)
name: alertas-semanales

on:
  # Para que corra solo cada lunes, quitar el # de las dos lineas siguientes DESPUES de crear el secreto
  # GEE_SERVICE_ACCOUNT_KEY (si no, fallaria cada semana).
  # schedule:
  #   - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilancia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Credenciales de Earth Engine
        env:
          KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p ~/.config/earthengine
          echo "$KEY" > /tmp/gee-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gee-key.json" >> "$GITHUB_ENV"
      - name: Revisar focos de calor y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m uma.alerts --project nasa-app-challenge-514714
      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "uma-bot"
          git config user.email "uma-bot@users.noreply.github.com"
          git add data/real/alertas_semanales.json data/real/uma.db
          git commit -m "Vigilancia semanal $(date +%F)" || echo "sin cambios"
          git push
